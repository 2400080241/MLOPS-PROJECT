
name: Smart Agriculture CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pandas scikit-learn joblib pytest httpx

      - name: Check project files
        run: |
          pwd
          ls -la
          ls -la tests
          ls -la models

      - name: Run automated tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v
